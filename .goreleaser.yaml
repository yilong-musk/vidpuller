# Release pipeline: pushing a vX.Y.Z tag builds static binaries for Linux,
# macOS and Windows (amd64/arm64), writes checksums and attaches everything to
# the GitHub release. No third-party dependencies, so no module downloads.
version: 2

project_name: vidpuller

before:
  hooks:
    - go run ./tools/langcheck

builds:
  - id: vidpuller
    main: .
    binary: vidpuller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: vidpuller
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - README.zh-TW.md
      - README.ja.md
      - README.ko.md
      - README.es.md
      - README.fr.md
      - README.de.md
      - README.pt.md
      - README.ru.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: vidpuller
    ids:
      - vidpuller
    binaries:
      - vidpuller
    homepage: https://github.com/yilong-musk/vidpuller
    description: Multi-platform video downloader (Douyin / TikTok / Bilibili / YouTube)
    repository:
      owner: yilong-musk
      name: homebrew-tap
      git:
        url: ssh://git@github.com/yilong-musk/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    hooks:
      post:
        # The archive is not notarised, so drop the quarantine flag Homebrew
        # sets on downloaded files; otherwise Gatekeeper blocks the binary.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/vidpuller"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
